name: Build Beba Agua APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip BebaAgua_Android_Projeto.zip

      - name: Habilitar AndroidX e corrigir Java
        working-directory: BebaAguaAndroid
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          sed -i 's/var prefs =/android.content.SharedPreferences prefs =/g' app/src/main/java/com/bebaagua/app/ReminderReceiver.java
          sed -i 's/var prefs =/android.content.SharedPreferences prefs =/g' app/src/main/java/com/bebaagua/app/ReminderScheduler.java
          sed -i 's/var p =/android.content.SharedPreferences p =/g' app/src/main/java/com/bebaagua/app/MainActivity.java

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: BebaAguaAndroid
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BebaAgua-APK
          path: BebaAguaAndroid/app/build/outputs/apk/debug/app-debug.apk
